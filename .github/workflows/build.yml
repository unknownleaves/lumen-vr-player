name: Build installers

on:
  push:
    tags: ['v*']          # push a tag like v1.0.0 to build and publish a GitHub Release
  workflow_dispatch:      # or run it from the Actions tab: enter a version to publish a release
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0 (leave empty for a test build without a release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win nsis portable --x64 --arm64 --publish never
          - os: macos-latest
            cmd: npx electron-builder --mac dmg zip --universal --publish never
          - os: ubuntu-latest
            cmd: npx electron-builder --linux AppImage deb tar.gz --x64 --arm64 --publish never
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds unless you add signing secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set the app version from the tag or the version you typed
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          npm version "${V#v}" --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npm test
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-vr-player-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Creates the tag (e.g. v1.0.0) on this commit when run from the Actions tab.
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Lumen VR Player ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
