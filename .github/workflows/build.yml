name: Build installers

# Releases are automatic: when "version" in package.json changes on main (e.g. 1.0.0 → 1.0.1)
# and there is no release for it yet, this builds every installer and publishes the release.
# Installed copies of the app then pick up the update.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.1 (empty = version in package.json)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="${INPUT_VERSION#v}"
          elif [ "$REF_TYPE" = "tag" ]; then V="${REF_NAME#v}"
          else V=$(node -p "require('./package.json').version"); fi
          if [ "$REF_TYPE" = "tag" ]; then R=true
          elif git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then R=false
          else R=true; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release=$R" >> "$GITHUB_OUTPUT"
          echo "Version $V — publish release: $R"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win nsis portable --x64 --arm64 --publish never
          - os: macos-latest
            cmd: npx electron-builder --mac dmg zip --universal --publish never
          - os: ubuntu-latest
            cmd: npx electron-builder --linux AppImage deb tar.gz --x64 --arm64 --publish never
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds unless you add signing secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set app version
        shell: bash
        run: npm version "${{ needs.plan.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npm test
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-vr-player-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: ignore

  docker:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set app version
        run: npm version "${{ needs.plan.outputs.version }}" --no-git-tag-version --allow-same-version
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/unknownleaves/lumen-vr-player:latest
            ghcr.io/unknownleaves/lumen-vr-player:${{ needs.plan.outputs.version }}

  android:
    needs: plan
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing key missing
        if: env.HAS_KEY != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are not set, so no APK is built."
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEY == 'true'
        with:
          gradle-version: '8.11.1'
      - name: Bundle the player into the APK
        if: env.HAS_KEY == 'true'
        shell: bash
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund "onnxruntime-web@$(node -p "require('./package.json').dependencies['onnxruntime-web']")"
          W=android/app/src/main/assets/www
          mkdir -p $W/node_modules/onnxruntime-web/dist
          cp -r src $W/
          D=node_modules/onnxruntime-web/dist
          cp $D/ort.webgpu.min.mjs $W/node_modules/onnxruntime-web/dist/
          cp $D/ort-wasm-simd-threaded.jsep.* $W/node_modules/onnxruntime-web/dist/ 2>/dev/null || cp $D/*.wasm $D/ort-wasm*.mjs $W/node_modules/onnxruntime-web/dist/
          ls -la $W/node_modules/onnxruntime-web/dist
      - name: Build signed APK
        if: env.HAS_KEY == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          V="$APP_VERSION"
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.p12" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64"; exit 1; }
          if ! keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass "$LUMEN_KEYSTORE_PASSWORD" -alias lumen > /dev/null 2> "$RUNNER_TEMP/ks.err"; then
            echo "::error::Signing key check failed: $(head -c 300 "$RUNNER_TEMP/ks.err" | tr '\n' ' ')"; exit 1
          fi
          export LUMEN_KEYSTORE="$RUNNER_TEMP/release.p12"
          set +e
          gradle -p android assembleRelease -PappVersionName="$V" -PappVersionCode="$CODE" --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            # Surface the real error as annotations (readable without signing in).
            L="$RUNNER_TEMP/gradle.log"
            # GitHub keeps at most 10 annotations per step, so send the essentials as single multi-line messages.
            WHAT=$(sed -n '/What went wrong/,/\* Try/p' "$L" | grep -v '^\s*$' | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            ERRS=$(grep -E "error:|ERROR:|AAPT|e: file" "$L" | grep -v '^\s*at ' | head -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$ERRS" ] && echo "::error title=Compiler errors::${ERRS:0:3500}"
            [ -n "$WHAT" ] && echo "::error title=Gradle failure::${WHAT:0:3500}"
            tail -30 "$L" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | { read -r T; echo "::error title=Log tail::${T:0:3500}"; }
            exit 1
          fi
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Lumen-VR-Player-$V.apk"
          rm -f "$RUNNER_TEMP/release.p12"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: lumen-vr-player-android
          path: dist/*.apk

  release:
    needs: [plan, build, android]
    # Publish when the desktop builds succeed, even if the Android build was skipped or failed.
    if: always() && needs.plan.outputs.release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lumen-vr-player-*     # only the installers, not Docker's build record
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lumen VR Player v${{ needs.plan.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
          make_latest: true
