plugins {
    id 'com.android.application'
}

// Version comes from package.json via the CI workflow (-PappVersionName / -PappVersionCode).
def vName = project.findProperty('appVersionName') ?: '1.0.0'
def vCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def keystorePath = System.getenv('LUMEN_KEYSTORE')
def keystorePassword = System.getenv('LUMEN_KEYSTORE_PASSWORD')

android {
    namespace 'io.lumen.vrplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'io.lumen.vrplayer'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storeType 'pkcs12'
                storePassword keystorePassword
                keyAlias 'lumen'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
